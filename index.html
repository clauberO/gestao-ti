<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GESTÃO TI — Protótipo navegável da central de operações de TI.">
<title>GESTÃO TI • Central de operações</title>
<style>:root{--bg:#f5f7fb;--panel:#fff;--text:#151c39;--muted:#6b7592;--border:#e1e5ef;--accent:#6d35ff;--soft:#eee8ff;--input:#fafbfe;--green:#16835a;--shadow:0 8px 30px #18234a05;color-scheme:light}html.dark{--bg:#10131b;--panel:#1b202c;--text:#f1f3fa;--muted:#adb6c9;--border:#333b4e;--accent:#a186ff;--soft:#30264d;--input:#232938;--green:#64d5aa;color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:9px;padding:10px 16px}button:hover,a:hover{filter:brightness(.95)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:#6d35ff;color:white;border-color:#6d35ff}.quiet{color:var(--accent)}a{color:var(--accent);text-decoration:none}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:19px;margin:0 0 18px}h3{margin:0 0 8px}p{margin:5px 0 20px;color:var(--muted)}small,.muted{color:var(--muted)}aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--panel);border-right:1px solid var(--border);padding:26px 16px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--accent);margin-right:9px}.brand small{display:block;font-size:12px;font-weight:400;letter-spacing:0;padding-left:34px}nav{margin-top:38px;display:grid;gap:7px}nav a{padding:12px;color:var(--muted);border-radius:8px}nav a.active{background:var(--soft);color:var(--accent);font-weight:650}nav a span{display:inline-block;width:30px}.profile{margin-top:auto;padding-top:26px}.avatar{display:inline-grid;place-items:center;background:var(--soft);color:var(--accent);width:38px;height:38px;border-radius:50%;font-weight:700;margin-right:8px}.shell{margin-left:230px}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--panel);padding:0 34px}main{padding:32px;max-width:1600px;margin:auto}.heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:22px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.two{grid-template-columns:repeat(2,1fr)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stat strong{display:block;font-size:32px}.stat small{font-size:13px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.tools{display:flex;gap:12px;margin-bottom:20px}.tools input{max-width:420px}input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}label{display:block;font-size:14px;font-weight:550;margin-bottom:16px}label input,label select,label textarea{margin-top:7px}textarea{min-height:95px;resize:vertical}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}td,th{padding:15px 12px;border-bottom:1px solid var(--border)}th{background:var(--input);color:var(--muted);font-size:12px}td:first-child{font-weight:600}td small{display:block}.badge{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;border-radius:20px;padding:5px 11px}.done{color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}.tabs{display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:25px}.tabs a{white-space:nowrap;padding:12px 0;color:var(--muted)}.tabs a.active{color:var(--accent);border-bottom:3px solid var(--accent)}.task{display:block;border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:14px;color:var(--text)}.task small{display:block;margin-top:8px}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{padding:45px 60px;background:var(--soft);display:flex;flex-direction:column;justify-content:center}.hero .brand{margin-bottom:60px}.hero h1{font-size:46px;line-height:1.15;max-width:570px;margin-bottom:25px}.hero h1 em{color:var(--accent);font-style:normal}.hero .card{max-width:440px;margin-top:15px}.authform{padding:55px;display:grid;place-items:center}.authform form{width:100%;max-width:460px}.authform h1{margin-bottom:8px}.authform .primary{width:100%;margin:20px 0}.notice{padding:12px 16px;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;margin-top:20px}.foot{margin-top:26px;color:var(--muted);font-size:12px}dialog{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;width:min(640px,94vw);max-height:90vh}dialog::backdrop{background:#0c102077;backdrop-filter:blur(3px)}#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--panel);padding:15px 22px;border-radius:10px;display:none;z-index:10}.empty{text-align:center;padding:38px;color:var(--muted)}.integration-icon{font-size:26px;color:var(--accent);background:var(--soft);padding:10px;border-radius:10px;display:inline-block;margin-bottom:18px}.bar{height:12px;background:var(--soft);border-radius:8px;margin:8px 0 20px}.bar div{height:100%;background:var(--accent);border-radius:8px}.mobile{display:none}@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hero{padding:30px}.hero h1{font-size:35px}}@media(max-width:720px){aside{display:none}.shell{margin:0}aside.open{display:flex;z-index:5;box-shadow:0 0 0 100vw #0007}.mobile{display:inline-block}main{padding:20px}header{padding:12px 20px}.grid,.two{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.auth{grid-template-columns:1fr}.hero{display:none}.authform{padding:30px 22px}.tools{flex-wrap:wrap}.stats .card{padding:16px}h1{font-size:26px}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="modal"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Ative o JavaScript no navegador para abrir o GESTÃO TI.</noscript>
<script>'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={chamados:[{id:'1063',nome:'Impressora sem comunicação',cliente:'Comercial Centro',responsavel:'Clauber Oliveira',status:'Em atendimento',prioridade:'Alta',data:'2026-09-25',descricao:'Impressora não responde após reconexão do cabo.'},{id:'1064',nome:'Revisão da rede local',cliente:'Comercial Centro',responsavel:'Paulo Lima',status:'Aberto',prioridade:'Média',data:'2026-09-28',descricao:'Verificar estabilidade da rede da Unidade Boa Vista.'}],atividades:[{id:'1054',nome:'Manutenção dos computadores',cliente:'Comercial Centro',responsavel:'Clauber Oliveira',status:'Em andamento',prioridade:'Média',data:'2026-09-25',descricao:'Limpeza e atualização dos computadores.'},{id:'1055',nome:'Conferir inventário',cliente:'Comercial Centro',responsavel:'Paulo Lima',status:'A fazer',prioridade:'Baixa',data:'2026-09-28'}],agenda:[{id:'AG-01',nome:'Revisão da rede local',cliente:'Comercial Centro',responsavel:'Clauber Oliveira',status:'Agendado',data:'2026-09-28',hora:'14:00',descricao:'Confirmar presença do responsável. Solicitar acesso ao rack na recepção.'}],equipamentos:[{id:'PAT-129',nome:'Notebook administrativo',cliente:'Comercial Centro',responsavel:'Ana Souza',status:'Em uso',modelo:'Dell Latitude',unidade:'Unidade Centro',descricao:'Core i5 • 16 GB • SSD 512 GB'},{id:'PAT-002',nome:'Roteador principal',cliente:'Comercial Centro',responsavel:'Paulo Lima',status:'Em uso',modelo:'Roteador gigabit',unidade:'Unidade Boa Vista'}],clientes:[{id:'CLI-001',nome:'Comercial Centro',responsavel:'Ana Souza',status:'Ativo',email:'contato@example.com',telefone:'',descricao:'Cliente empresarial.'}],unidades:[{id:'UNI-002',nome:'Unidade Boa Vista',cliente:'Comercial Centro',responsavel:'Paulo Lima',status:'Ativa',email:'unidade@example.com',endereco:'Rua Exemplo, 250 • Loja 02, Recife – PE',descricao:'Solicitar acesso ao rack na recepção.'}],usuarios:[{id:'USR-1',nome:'Clauber Oliveira',email:'clauber@example.com',status:'Ativo',perfil:'Administrador'},{id:'USR-2',nome:'Ana Souza',email:'ana@example.com',status:'Ativo',perfil:'Gestor'},{id:'USR-3',nome:'Paulo Lima',email:'paulo@example.com',status:'Ativo',perfil:'Técnico'}],manutencoes:[],settings:{},profile:{nome:'Clauber Oliveira',email:'clauber@example.com'}};
let db;try{db=JSON.parse(localStorage.getItem('gestao-ti-v1'))||structuredClone(seed)}catch{db=structuredClone(seed)}
const names={inicio:'Visão geral',atividades:'Atividades',chamados:'Chamados',agenda:'Agenda',equipamentos:'Equipamentos',clientes:'Clientes',unidades:'Unidades',relatorios:'Relatórios',configuracoes:'Configurações',usuarios:'Usuários e permissões',manutencoes:'Manutenções'};
const statuses={chamados:['Aberto','Em atendimento','Aguardando cliente','Resolvido'],atividades:['A fazer','Em andamento','Concluído'],agenda:['Agendado','Concluído','Cancelado'],equipamentos:['Em uso','Em manutenção','Inativo'],clientes:['Ativo','Inativo'],unidades:['Ativa','Inativa'],usuarios:['Ativo','Pendente','Inativo'],manutencoes:['Concluído','Em andamento']};
const route=()=>location.hash.slice(1).split('/').filter(Boolean);
function persist(){try{localStorage.setItem('gestao-ti-v1',JSON.stringify(db));return true}catch{toast('Não foi possível salvar neste navegador.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}
function theme(){document.documentElement.classList.toggle('dark');localStorage.setItem('gestao-theme',document.documentElement.classList.contains('dark')?'dark':'light')}
if(localStorage.getItem('gestao-theme')==='dark')document.documentElement.classList.add('dark');
function brand(){return '<div class="brand"><b>▣</b> GESTÃO TI<small>Central de operações</small></div>'}
function field(label,name,value='',type='text',opts){return `<label>${esc(label)}${opts?`<select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${name==='nome'?'required maxlength="120"':''}>`}</label>`}
function shell(content,title,active){return `<aside>${brand()}<nav>${['inicio','atividades','chamados','agenda','equipamentos','clientes','relatorios','configuracoes'].map((k,i)=>`<a class="${k===active?'active':''}" href="#${k}"><span>${['⌂','☑','▤','▦','▣','♙','▥','⚙'][i]}</span>${names[k]}</a>`).join('')}</nav><div class="profile"><span class="avatar">CO</span>${esc(db.profile.nome)}<small style="display:block">Administrador · <a href="#login">Sair da prévia</a></small></div></aside><div class="shell"><header><div><button class="mobile" data-action="menu" aria-label="Abrir menu">☰</button> <span class="muted">Meu espaço /</span> ${esc(title)}</div><button data-action="theme">◐ <span>Tema</span></button></header><main>${content}<div class="foot">Prévia navegável • Dados demonstrativos salvos somente neste navegador</div></main></div>`}
function table(key,rows=db[key]){return `<div class="tablewrap"><table><thead><tr><th>Nome / identificação</th><th>Responsável</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#${key}/${r.id}">${esc(r.nome)}</a><small>${esc(r.id)} ${r.cliente?'• '+esc(r.cliente):''}</small></td><td>${esc(r.responsavel||r.email||'—')}</td><td><span class="badge ${['Concluído','Resolvido','Ativo','Em uso'].includes(r.status)?'done':''}">${esc(r.status)}</span></td><td><button data-action="edit" data-key="${key}" data-id="${r.id}">Editar</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div>`}
function list(key){return `<div class="heading"><div><h1>${names[key]}</h1><p>Organize e acompanhe os registros da sua operação.</p></div><div class="row">${key==='clientes'?'<a href="#unidades">Ver unidades</a>':''}<button class="primary" data-action="new" data-key="${key}">+ Novo registro</button></div></div><section class="card"><div class="tools"><input id="search" aria-label="Buscar registros" placeholder="Buscar por nome, cliente ou responsável…"><select id="statusFilter" style="max-width:210px"><option value="">Todos os status</option>${statuses[key].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="results">${table(key)}</div></section>`}
function dashboard(){return `<div class="heading"><div><h1>Visão geral</h1><p>Bem-vindo, Clauber. Veja o que precisa da sua atenção.</p></div><button class="primary" data-action="new" data-key="chamados">+ Novo chamado</button></div><div class="stats">${[['Chamados abertos',db.chamados.filter(x=>x.status!=='Resolvido').length],['Atividades pendentes',db.atividades.filter(x=>x.status!=='Concluído').length],['Equipamentos',db.equipamentos.length],['Clientes',db.clientes.length]].map(([l,v])=>`<div class="card stat"><small>${l}</small><strong>${v}</strong></div>`).join('')}</div><div class="heading"><h2>Atividades da equipe</h2><a href="#atividades">Ver todas →</a></div><div class="grid">${statuses.atividades.map(s=>`<section class="card"><div class="row between"><h3>${s}</h3><span class="badge">${db.atividades.filter(x=>x.status===s).length}</span></div>${db.atividades.filter(x=>x.status===s).map(x=>`<a class="task" href="#atividades/${x.id}"><strong>${esc(x.nome)}</strong><small>${esc(x.cliente)}</small><small>${esc(x.responsavel)} · ${esc(x.data||'Sem prazo')}</small></a>`).join('')||'<p class="empty">Sem atividades nesta etapa.</p>'}</section>`).join('')}</div><section class="card" style="margin-top:24px"><h2>Chamados recentes</h2>${table('chamados',db.chamados.slice(-5))}</section>`}
function detail(key,id){const r=db[key].find(x=>x.id===id);if(!r)return '<h1>Registro não encontrado</h1><a href="#inicio">Voltar ao início</a>';return `<a href="#${key}">← ${names[key]}</a><div class="heading" style="margin-top:20px"><div><h1>${esc(r.nome)}</h1><p>${esc(r.id)} · ${esc(r.status)}</p></div><div class="row"><button data-action="edit" data-key="${key}" data-id="${id}">Editar</button>${['chamados','atividades'].includes(key)?`<button class="primary" data-action="complete" data-key="${key}" data-id="${id}">Concluir</button>`:''}</div></div><div class="grid two"><section class="card"><h2>Informações</h2>${Object.entries(r).filter(([k])=>!['nome','descricao','historico'].includes(k)).map(([k,v])=>`<p><small>${esc(({responsavel:'Responsável',data:'Data',cliente:'Cliente',prioridade:'Prioridade',endereco:'Endereço',id:'Identificação',status:'Status',unidade:'Unidade',modelo:'Modelo',email:'E-mail',perfil:'Perfil',telefone:'Telefone',hora:'Horário'})[k]||k)}</small><br><strong style="color:var(--text)">${esc(v||'Não informado')}</strong></p>`).join('')}</section><section class="card"><h2>Descrição e observações</h2><p>${esc(r.descricao||'Nenhuma observação registrada.')}</p>${key==='equipamentos'?`<button data-action="maintenance" data-id="${id}">+ Registrar manutenção</button><h2 style="margin-top:24px">Histórico de manutenção</h2>${db.manutencoes.filter(m=>m.equipamento===id).map(m=>`<a class="task" href="#manutencoes/${m.id}">${esc(m.nome)}<small>${esc(m.data)} • ${esc(m.status)}</small></a>`).join('')||'<p>Nenhuma manutenção registrada.</p>'}`:''}<h2 style="margin-top:24px">Histórico</h2>${(r.historico||[]).map(h=>`<p>${esc(h)}</p>`).join('')||'<p>Registro de demonstração.</p>'}</section></div>`}
function editor(key,id,extra={}){const r=id?db[key].find(x=>x.id===id):{...extra};const html=`<form id="editForm"><div class="heading"><h2>${id?'Editar':'Novo'} registro</h2><button type="button" data-action="close" aria-label="Fechar">×</button></div>${field('Nome / título','nome',r.nome)}<div class="grid two">${['clientes','usuarios'].includes(key)?field('E-mail','email',r.email,'email'):field('Cliente','cliente',r.cliente||'Comercial Centro')}${key==='usuarios'?field('Perfil','perfil',r.perfil,'text',['Administrador','Gestor','Técnico']):field('Responsável','responsavel',r.responsavel||'Clauber Oliveira')}${field('Status','status',r.status||statuses[key][0],'text',statuses[key])}${['chamados','atividades'].includes(key)?field('Prioridade','prioridade',r.prioridade||'Média','text',['Crítica','Alta','Média','Baixa']):''}${['chamados','atividades','agenda','manutencoes'].includes(key)?field('Data','data',r.data,'date'):''}${key==='agenda'?field('Horário','hora',r.hora,'time'):''}${key==='equipamentos'?field('Modelo','modelo',r.modelo)+field('Unidade','unidade',r.unidade):''}${key==='unidades'?field('Endereço','endereco',r.endereco)+field('E-mail','email',r.email,'email'):''}${key==='clientes'?field('Telefone','telefone',r.telefone,'tel'):''}</div><label>Observações<textarea name="descricao">${esc(r.descricao||'')}</textarea></label><div class="row"><button class="primary">Salvar registro</button><button type="button" data-action="close">Cancelar</button></div></form>`;$('#modal').innerHTML=html;$('#modal').showModal();$('#editForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.nome.trim())return;const record={...r,...d,id:id||Date.now().toString(36),historico:[...(r.historico||[]),`${new Date().toLocaleString('pt-BR')} • ${id?'Registro atualizado':'Registro criado'}`]};if(id)db[key][db[key].findIndex(x=>x.id===id)]=record;else db[key].push(record);if(persist()){ $('#modal').close();render();toast('Registro salvo na demonstração.')}}}
function reports(){const total=db.chamados.length;return `<div class="heading"><div><h1>Relatórios</h1><p>Indicadores calculados a partir dos registros desta prévia.</p></div><button data-action="export">Exportar chamados CSV</button></div><div class="grid two"><section class="card"><h2>Chamados por status</h2>${statuses.chamados.map(s=>{const n=db.chamados.filter(x=>x.status===s).length;return `<div class="row between"><span>${s}</span><b>${n}</b></div><div class="bar"><div style="width:${total?n/total*100:0}%"></div></div>`}).join('')}</section><section class="card"><h2>Resumo da operação</h2><p>${total} chamados registrados</p><p>${db.atividades.length} atividades</p><p>${db.equipamentos.length} equipamentos</p><p>${db.clientes.length} clientes</p><p>${db.manutencoes.length} manutenções</p></section></div>`}
function settings(tab='geral'){const tabs={geral:'Geral',usuarios:'Usuários e permissões',sla:'Atendimento e SLA',integracoes:'Integrações',seguranca:'Segurança e perfil'};let body='';if(tab==='usuarios')body=`<section class="card"><div class="heading"><h2>Equipe</h2><button class="primary" data-action="new" data-key="usuarios">+ Adicionar à prévia</button></div>${table('usuarios')}</section>`;
else if(tab==='integracoes')body=`<div class="grid">${['E-mail de atendimento','Google Agenda','WhatsApp Business','Microsoft Outlook','Webhooks','API do sistema'].map((x,i)=>`<section class="card"><div class="integration-icon">${['✉','▦','☏','▦','⌘','⌗'][i]}</div><h2>${x}</h2><span class="badge">Não conectado</span><p style="margin-top:16px">Integração prevista para a etapa de desenvolvimento do servidor.</p><button data-action="integration">Ver disponibilidade</button></section>`).join('')}</div>`;
else if(tab==='sla'){const s=db.settings.sla||{};body=`<form id="settingsForm" data-tab="sla"><div class="grid two"><section class="card"><h2>Prazos por prioridade</h2><div class="tablewrap"><table><thead><tr><th>Prioridade</th><th>Resposta (min)</th><th>Resolução (h)</th></tr></thead><tbody>${['Crítica','Alta','Média','Baixa'].map((p,i)=>`<tr><td>${p}</td><td><input aria-label="Resposta ${p}" type="number" min="1" required name="resposta${i}" value="${esc(s['resposta'+i]||[15,30,120,240][i])}"></td><td><input aria-label="Resolução ${p}" type="number" min="1" required name="resolucao${i}" value="${esc(s['resolucao'+i]||[4,8,16,24][i])}"></td></tr>`).join('')}</tbody></table></div><p>Valores de demonstração em horas úteis.</p></section><section class="card"><h2>Calendário de atendimento</h2>${field('Início','inicio',s.inicio||'08:00','time')}${field('Fim','fim',s.fim||'18:00','time')}${field('Dias','dias',s.dias||'Segunda a sexta','text',['Segunda a sexta','Todos os dias'])}${field('Alertar antes do vencimento (min)','alerta',s.alerta||30,'number')}<p>Configuração visual; os prazos ainda não são processados no servidor.</p></section></div><button class="primary" style="margin-top:20px">Salvar na prévia</button></form>`}
else if(tab==='seguranca')body=`<div class="grid two"><form id="profileForm" class="card"><h2>Meu perfil</h2>${field('Nome completo','nome',db.profile.nome)}${field('E-mail','email',db.profile.email,'email')}<button class="primary">Salvar perfil da prévia</button></form><section class="card"><h2>Segurança da conta</h2><p>Autenticação real, sessões e verificação em duas etapas serão implementadas com o servidor.</p><a class="task" href="#redefinir">Visualizar redefinição de senha →</a><div class="notice">Nenhuma senha é armazenada neste protótipo.</div></section></div>`;
else {const s=db.settings.geral||{};body=`<form id="settingsForm" data-tab="geral" class="card"><h2>Preferências do espaço</h2><div class="grid two">${field('Nome do espaço','espaco',s.espaco||'Central de operações')}${field('Idioma','idioma','Português (Brasil)','text',['Português (Brasil)'])}${field('Fuso horário','fuso','Recife (UTC−03)','text',['Recife (UTC−03)'])}${field('Página inicial','pagina',s.pagina||'Visão geral','text',['Visão geral','Atividades','Chamados'])}</div><button class="primary">Salvar preferências</button></form>`}return `<div class="heading"><div><h1>${tabs[tab]||tabs.geral}</h1><p>Personalize seu espaço de trabalho.</p></div></div><div class="tabs">${Object.entries(tabs).map(([k,v])=>`<a href="#configuracoes/${k}" class="${k===tab?'active':''}">${v}</a>`).join('')}</div>${body}`}
function auth(page){const reset=page==='redefinir',recover=page==='recuperar';return `<div class="auth"><section class="hero">${brand()}<h1>Sua operação de TI,<br><em>em um só lugar.</em></h1><p>Organize chamados, atividades e equipamentos com mais clareza.</p><div class="card"><h2>Tudo sob controle</h2><p>☑ Chamados e atendimentos</p><p>▦ Agenda da equipe</p><p>▣ Gestão de equipamentos</p></div></section><section class="authform"><form id="authForm"><div class="row between" style="margin-bottom:35px"><span class="badge">Demonstração</span><button type="button" data-action="theme">◐ Tema</button></div><h1>${reset?'Redefinir senha':recover?'Recuperar senha':'Bem-vindo de volta'}</h1><p>${reset?'Visualize a criação de uma nova senha.':recover?'Informe um e-mail de exemplo para simular a recuperação.':'Explore o protótipo do GESTÃO TI.'}</p>${reset?'<label>Nova senha<input type="password" name="senha" minlength="12" required autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" name="confirmar" minlength="12" required autocomplete="new-password"></label>':field('E-mail de exemplo','email','','email')}${!reset&&!recover?'<div class="notice">Acesso demonstrativo, sem senha. Não use dados reais.</div>':''}<button class="primary">${reset?'Simular redefinição':recover?'Simular envio de instruções':'Entrar na demonstração'} →</button><div class="row between">${!reset&&!recover?'<a href="#recuperar">Esqueci minha senha</a>':'<a href="#login">← Voltar para o login</a>'}${recover?'<a href="#redefinir">Ver próxima tela →</a>':''}</div><div class="foot">Prévia de interface • Nenhum e-mail é enviado</div></form></section></div>`}
function render(){let [page='login',id]=route();if(['login','recuperar','redefinir'].includes(page)){$('#app').innerHTML=auth(page);$('#authForm').onsubmit=e=>{e.preventDefault();if(page==='login'){const s=db.settings.geral?.pagina;location.hash=s==='Atividades'?'atividades':s==='Chamados'?'chamados':'inicio'}else if(page==='recuperar')toast('Simulação concluída. Nenhum e-mail foi enviado.');else{const f=new FormData(e.target);if(f.get('senha')!==f.get('confirmar'))return toast('As senhas não coincidem.');e.target.reset();toast('Redefinição simulada. Nenhuma senha foi armazenada.')}};return}let content=page==='inicio'?dashboard():page==='configuracoes'?settings(id):page==='relatorios'?reports():statuses[page]?(id?detail(page,id):list(page)):'<h1>Página não encontrada</h1><a href="#inicio">Voltar ao início</a>';$('#app').innerHTML=shell(content,names[page]||'Página',page==='unidades'?'clientes':page==='usuarios'?'configuracoes':page);if($('#search')){const filter=()=>{const q=$('#search').value.toLocaleLowerCase('pt-BR'),s=$('#statusFilter').value;$('#results').innerHTML=table(page,db[page].filter(r=>(!s||r.status===s)&&Object.values(r).join(' ').toLocaleLowerCase('pt-BR').includes(q)))};$('#search').oninput=filter;$('#statusFilter').onchange=filter}if($('#settingsForm'))$('#settingsForm').onsubmit=e=>{e.preventDefault();db.settings[e.target.dataset.tab]=Object.fromEntries(new FormData(e.target));if(persist())toast('Preferências salvas na prévia.')};if($('#profileForm'))$('#profileForm').onsubmit=e=>{e.preventDefault();db.profile=Object.fromEntries(new FormData(e.target));if(persist()){render();toast('Perfil da prévia atualizado.')}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,key,id}=b.dataset;if(action==='theme')theme();if(action==='menu')$('aside').classList.toggle('open');if(action==='new')editor(key);if(action==='edit')editor(key,id);if(action==='close')$('#modal').close();if(action==='maintenance')editor('manutencoes',null,{equipamento:id,nome:'Manutenção preventiva',status:'Concluído'});if(action==='complete'){const r=db[key].find(x=>x.id===id);r.status=key==='chamados'?'Resolvido':'Concluído';r.historico=[...(r.historico||[]),new Date().toLocaleString('pt-BR')+' • Registro concluído'];if(persist()){render();toast('Registro concluído.')}}if(action==='integration')toast('A conexão real será disponibilizada na etapa de backend.');if(action==='export'){const safe=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const cols=['id','nome','cliente','responsavel','status','prioridade','data'];const csv='\ufeff'+[cols,...db.chamados.map(r=>cols.map(k=>r[k]))].map(a=>a.map(safe).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='chamados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
window.addEventListener('hashchange',()=>{$('#modal').close();render();window.scrollTo(0,0)});render();
</script>
</body>
</html>
